name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The docs build (which builds @funstack/ui first) writes the Markdown edition that the
      # package's prepack step copies into dist/docs.
      - name: Build
        run: pnpm turbo run build --filter=docs

      - name: Check package contents
        run: pnpm --filter @funstack/ui pack:check

      # Stable versions go to `latest`. A prerelease is published under its prerelease name
      # ("alpha" for 0.1.0-alpha.30). Until 1.0 (a 0.x prerelease, or a 1.0.0-* one) `latest` is
      # then moved to it as well, so `npm i @funstack/ui` installs the newest release; from 1.0
      # on a prerelease gets only its prerelease tag.
      - name: Determine npm tags
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            # Prerelease version - extract tag (e.g., "alpha" from "0.0.1-alpha.0")
            PRERELEASE_TAG=$(echo "$VERSION" | sed 's/.*-\([a-zA-Z]*\).*/\1/')
            if [[ -z "$PRERELEASE_TAG" ]]; then
              echo "::error::Cannot derive a dist-tag from prerelease version $VERSION"
              exit 1
            fi
            CORE="${VERSION%%-*}"
            echo "tag=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
            if [[ "$CORE" == 0.* || "$CORE" == "1.0.0" ]]; then
              echo "extra-tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "extra-tag=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "extra-tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: pnpm --filter @funstack/ui publish --access public --tag ${{ steps.npm-tag.outputs.tag }} --no-git-checks

      # Moves `latest` to a pre-1.0 prerelease published above under its prerelease tag. The
      # publish goes first so that, if this step fails, the tag the docs install (`@alpha`) is
      # still current and only `latest` is stale. OIDC covers dist-tag operations only with the
      # "Allow npm dist-tag" option of the trusted publisher configuration and npm 11.21.0 or
      # later, hence npx. No continue-on-error: a failure must be visible.
      - name: Move latest dist-tag
        if: steps.npm-tag.outputs.extra-tag != ''
        working-directory: packages/ui
        env:
          VERSION: ${{ steps.npm-tag.outputs.version }}
          EXTRA_TAG: ${{ steps.npm-tag.outputs.extra-tag }}
        run: |
          npx --yes npm@^11.21.0 dist-tag add "@funstack/ui@$VERSION" "$EXTRA_TAG"
          npx --yes npm@^11.21.0 dist-tag ls @funstack/ui
